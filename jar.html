<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>the dream jar — nabii</title>

  <body>
    <div class="night" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <header class="jar-head">
      <h1>the dream jar</h1>
      <p><span id="count">0</span> dreams held</p>

      <div class="jar">

        <div class="jar__neck"></div>
        <div class="jar__glass">
          <div class="jar__shine" aria-hidden="true"></div>
          <div class="jar__dreams" id="jarDreams" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <p class="latest" id="latest" aria-live="polite"></p>

    <footer class="jar-foot">nabii · it came to me in a dream · Workers Club, Naarm · 10 Sep</footer>
